<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#160d17" />
    <meta
      name="description"
      content="Un jardín chiquito lleno de te quiero y te amo para una panita especial."
    />
    <title>Para vos, panita</title>
    <script>
      document.documentElement.classList.add('js');
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="ambient__orb ambient__orb--one"></span>
      <span class="ambient__orb ambient__orb--two"></span>
      <span class="ambient__orb ambient__orb--three"></span>
      <span class="ambient__grain"></span>
    </div>

    <section class="loader" id="loader" aria-live="polite" aria-label="Preparando una sorpresa">
      <div class="loader__content">
        <div class="loader__petals" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="loader__eyebrow">un segundito</p>
        <h1 class="loader__title">Esperate, panita.<br />Se vienen cosas lindas.</h1>
        <div class="loader__track" aria-hidden="true"><span></span></div>
        <p class="loader__aside">ya casi</p>
      </div>
    </section>

    <main class="home" id="home">
      <header class="home__intro">
        <p class="home__kicker">para vos, panita</p>
        <h1>No hacía falta una fecha especial.</h1>
        <p>Solamente un lugarcito para recordarte algo simple.</p>
      </header>

      <section class="flower-stage" aria-label="Una rosa de pétalos formando un corazón">
        <div class="flower-stage__halo" aria-hidden="true"></div>

        <button
          class="love-heart"
          id="loveHeart"
          type="button"
          aria-label="Hacer llover más te quiero y te amo"
          aria-describedby="flowerHint"
        >
          <svg
            class="love-heart__svg"
            id="heartFlower"
            viewBox="-230 -225 460 470"
            role="img"
            aria-labelledby="flowerTitle flowerDesc"
          >
            <title id="flowerTitle">Rosa de pétalos en forma de corazón</title>
            <desc id="flowerDesc">Pétalos rosados forman un corazón alrededor de una rosa central.</desc>
            <defs>
              <linearGradient id="petalRose" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffd9df" />
                <stop offset="0.42" stop-color="#ef7f99" />
                <stop offset="1" stop-color="#a92b55" />
              </linearGradient>
              <linearGradient id="petalDeep" x1="0" y1="0" x2="0.9" y2="1">
                <stop offset="0" stop-color="#ffbdca" />
                <stop offset="0.5" stop-color="#ce496b" />
                <stop offset="1" stop-color="#721a39" />
              </linearGradient>
              <filter id="petalShadow" x="-45%" y="-45%" width="190%" height="190%">
                <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#240610" flood-opacity="0.28" />
              </filter>
              <filter id="coreGlow" x="-70%" y="-70%" width="240%" height="240%">
                <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#260712" flood-opacity="0.36" />
                <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff9bb1" flood-opacity="0.18" />
              </filter>
              <path id="petalShape" d="M 0 -32 C 13 -29 26 -16 24 -1 C 22 15 9 29 -3 36 C -6 23 -14 15 -22 6 C -31 -7 -23 -27 0 -32 Z" />
            </defs>
