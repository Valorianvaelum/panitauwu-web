<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#160d17" />
    <meta
      name="description"
      content="Un jardín chiquito lleno de te quiero y te amo para una panita especial."
    />
    <title>Para vos, panita</title>
    <script>
      document.documentElement.classList.add('js');
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="ambient__orb ambient__orb--one"></span>
      <span class="ambient__orb ambient__orb--two"></span>
      <span class="ambient__orb ambient__orb--three"></span>
      <span class="ambient__grain"></span>
    </div>

    <section class="loader" id="loader" aria-live="polite" aria-label="Preparando una sorpresa">
      <div class="loader__content">
        <div class="loader__petals" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="loader__eyebrow">un segundito</p>
        <h1 class="loader__title">Esperate, panita.<br />Se vienen cosas lindas.</h1>
        <div class="loader__track" aria-hidden="true"><span></span></div>
        <p class="loader__aside">ya casi</p>
      </div>
    </section>

    <main class="home" id="home">
      <header class="home__intro">
        <p class="home__kicker">para vos, panita</p>
        <h1>No hacía falta una fecha especial.</h1>
        <p>Solamente un lugarcito para recordarte algo simple.</p>
      </header>

      <section class="flower-stage" aria-label="Una rosa de pétalos formando un corazón">
        <div class="flower-stage__halo" aria-hidden="true"></div>

        <button
          class="love-heart"
          id="loveHeart"
          type="button"
          aria-label="Hacer llover más te quiero y te amo"
          aria-describedby="flowerHint"
        >
          <svg
            class="love-heart__svg"
            id="heartFlower"
            viewBox="-230 -225 460 470"
            role="img"
            aria-labelledby="flowerTitle flowerDesc"
          >
            <title id="flowerTitle">Rosa de pétalos en forma de corazón</title>
            <desc id="flowerDesc">Pétalos rosados forman un corazón alrededor de una rosa central.</desc>
            <defs>
              <linearGradient id="petalRose" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffd9df" />
                <stop offset="0.42" stop-color="#ef7f99" />
                <stop offset="1" stop-color="#a92b55" />
              </linearGradient>
              <linearGradient id="petalDeep" x1="0" y1="0" x2="0.9" y2="1">
                <stop offset="0" stop-color="#ffbdca" />
                <stop offset="0.5" stop-color="#ce496b" />
                <stop offset="1" stop-color="#721a39" />
              </linearGradient>
              <radialGradient id="roseCore" cx="45%" cy="38%" r="70%">
                <stop offset="0" stop-color="#ffdce3" />
                <stop offset="0.45" stop-color="#e76684" />
                <stop offset="1" stop-color="#7d1838" />
              </radialGradient>
              <filter id="petalShadow" x="-40%" y="-40%" width="180%" height="180%">
                <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#250712" flood-opacity="0.34" />
              </filter>
              <filter id="coreGlow" x="-60%" y="-60%" width="220%" height="220%">
                <feDropShadow dx="0" dy="0" stdDeviation="13" flood-color="#ff9fb3" flood-opacity="0.28" />
              </filter>
              <path id="petalShape" d="M 0 -31 C 22 -24 27 2 4 31 C 1 35 -1 35 -4 31 C -27 2 -22 -24 0 -31 Z" />
              <path id="corePetalShape" d="M 0 -35 C 27 -26 30 5 5 32 C 2 36 -2 36 -5 32 C -30 5 -27 -26 0 -35 Z" />
            </defs>

            <g id="heartPetals" class="heart-petals" filter="url(#petalShadow)"></g>

            <g class="rose" filter="url(#coreGlow)" aria-hidden="true">
              <g class="rose__outer">
                <use href="#corePetalShape" transform="rotate(0) translate(0 -48) scale(1.05)" />
                <use href="#corePetalShape" transform="rotate(45) translate(0 -48) scale(1.05)" />
                <use href="#corePetalShape" transform="rotate(90) translate(0 -48) scale(1.05)" />
                <use href="#corePetalShape" transform="rotate(135) translate(0 -48) scale(1.05)" />
                <use href="#corePetalShape" transform="rotate(180) translate(0 -48) scale(1.05)" />
                <use href="#corePetalShape" transform="rotate(225) translate(0 -48) scale(1.05)" />
                <use href="#corePetalShape" transform="rotate(270) translate(0 -48) scale(1.05)" />
                <use href="#corePetalShape" transform="rotate(315) translate(0 -48) scale(1.05)" />
              </g>
              <g class="rose__middle">
                <use href="#corePetalShape" transform="rotate(22) translate(0 -29) scale(.82)" />
                <use href="#corePetalShape" transform="rotate(94) translate(0 -29) scale(.82)" />
                <use href="#corePetalShape" transform="rotate(166) translate(0 -29) scale(.82)" />
                <use href="#corePetalShape" transform="rotate(238) translate(0 -29) scale(.82)" />
                <use href="#corePetalShape" transform="rotate(310) translate(0 -29) scale(.82)" />
              </g>
              <g class="rose__inner">
                <use href="#corePetalShape" transform="rotate(0) translate(0 -15) scale(.58)" />
                <use href="#corePetalShape" transform="rotate(120) translate(0 -15) scale(.58)" />
                <use href="#corePetalShape" transform="rotate(240) translate(0 -15) scale(.58)" />
                <circle r="12" fill="url(#roseCore)" />
              </g>
            </g>
          </svg>
        </button>

        <p class="flower-stage__hint" id="flowerHint">tocá la flor</p>
      </section>

      <footer class="home__footer" aria-hidden="true">
        <span></span>
        <p>te quiero · te amo · te quiero · te amo</p>
        <span></span>
      </footer>
    </main>

    <div class="love-rain" id="loveRain" aria-hidden="true"></div>

    <noscript>
      <p class="noscript">Esta flor necesita JavaScript para hacer llover los mensajes, pero el cariño sigue estando.</p>
    </noscript>
  </body>
</html>
